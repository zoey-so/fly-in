[project]
name = "fly-in"
version = "0.1.0"
description = "Flow network graph calculations without graph libs"
readme = "README.md"
authors = [
    { name = "zoey-so", email = "xkokaxx@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fly-in = "fly_in.__main__:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
]
gui = [
    "pygame-ce>=2.5.8",
]
